appId: com.ploxc.modbux
productName: Modbux
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # node-gyp compiles a native module at install time, and a shipped app
  # compiles nothing: node-gyp-build is what loads the prebuilt binding at
  # runtime. It arrives because @serialport/bindings-cpp declares it, and it
  # brings a tree of its own that is most of what ends up packed.
  #
  # The names below are every package reachable from the production
  # dependencies only through node-gyp, derived from yarn.lock rather than
  # written out by hand. A name that disappears makes its pattern match
  # nothing, which is harmless; a name that appears later is packed until this
  # is derived again.
  - "!**/node_modules/@isaacs/cliui/**"
  - "!**/node_modules/@isaacs/fs-minipass/**"
  - "!**/node_modules/@npmcli/agent/**"
  - "!**/node_modules/@npmcli/fs/**"
  - "!**/node_modules/@pkgjs/parseargs/**"
  - "!**/node_modules/abbrev/**"
  - "!**/node_modules/agent-base/**"
  - "!**/node_modules/ansi-regex/**"
  - "!**/node_modules/ansi-styles/**"
  - "!**/node_modules/balanced-match/**"
  - "!**/node_modules/brace-expansion/**"
  - "!**/node_modules/cacache/**"
  - "!**/node_modules/chownr/**"
  - "!**/node_modules/color-convert/**"
  - "!**/node_modules/color-name/**"
  - "!**/node_modules/concat-map/**"
  - "!**/node_modules/cross-spawn/**"
  - "!**/node_modules/eastasianwidth/**"
  - "!**/node_modules/emoji-regex/**"
  - "!**/node_modules/encoding/**"
  - "!**/node_modules/env-paths/**"
  - "!**/node_modules/err-code/**"
  - "!**/node_modules/exponential-backoff/**"
  - "!**/node_modules/fdir/**"
  - "!**/node_modules/foreground-child/**"
  - "!**/node_modules/fs-minipass/**"
  - "!**/node_modules/fs.realpath/**"
  - "!**/node_modules/glob/**"
  - "!**/node_modules/graceful-fs/**"
  - "!**/node_modules/http-cache-semantics/**"
  - "!**/node_modules/http-proxy-agent/**"
  - "!**/node_modules/https-proxy-agent/**"
  - "!**/node_modules/iconv-lite/**"
  - "!**/node_modules/imurmurhash/**"
  - "!**/node_modules/inflight/**"
  - "!**/node_modules/inherits/**"
  - "!**/node_modules/ip-address/**"
  - "!**/node_modules/is-fullwidth-code-point/**"
  - "!**/node_modules/isexe/**"
  - "!**/node_modules/jackspeak/**"
  - "!**/node_modules/lru-cache/**"
  - "!**/node_modules/make-fetch-happen/**"
  - "!**/node_modules/minimatch/**"
  - "!**/node_modules/minipass/**"
  - "!**/node_modules/minipass-collect/**"
  - "!**/node_modules/minipass-fetch/**"
  - "!**/node_modules/minipass-flush/**"
  - "!**/node_modules/minipass-pipeline/**"
  - "!**/node_modules/minipass-sized/**"
  - "!**/node_modules/minizlib/**"
  - "!**/node_modules/negotiator/**"
  - "!**/node_modules/node-gyp/**"
  - "!**/node_modules/nopt/**"
  - "!**/node_modules/once/**"
  - "!**/node_modules/p-map/**"
  - "!**/node_modules/package-json-from-dist/**"
  - "!**/node_modules/path-is-absolute/**"
  - "!**/node_modules/path-key/**"
  - "!**/node_modules/path-scurry/**"
  - "!**/node_modules/picomatch/**"
  - "!**/node_modules/proc-log/**"
  - "!**/node_modules/promise-retry/**"
  - "!**/node_modules/retry/**"
  - "!**/node_modules/safer-buffer/**"
  - "!**/node_modules/semver/**"
  - "!**/node_modules/shebang-command/**"
  - "!**/node_modules/shebang-regex/**"
  - "!**/node_modules/signal-exit/**"
  - "!**/node_modules/smart-buffer/**"
  - "!**/node_modules/socks/**"
  - "!**/node_modules/socks-proxy-agent/**"
  - "!**/node_modules/ssri/**"
  - "!**/node_modules/string-width/**"
  - "!**/node_modules/string-width-cjs/**"
  - "!**/node_modules/strip-ansi/**"
  - "!**/node_modules/strip-ansi-cjs/**"
  - "!**/node_modules/tar/**"
  - "!**/node_modules/tinyglobby/**"
  - "!**/node_modules/undici/**"
  - "!**/node_modules/unique-filename/**"
  - "!**/node_modules/unique-slug/**"
  - "!**/node_modules/which/**"
  - "!**/node_modules/wrap-ansi/**"
  - "!**/node_modules/wrap-ansi-cjs/**"
  - "!**/node_modules/wrappy/**"
  - "!**/node_modules/yallist/**"

  # node-gyp-build prefers a compiled build/Release over the prebuilds, and does
  # not fall back. A cross-built package would carry the build host's
  # architecture. Excluded, so the per-arch prebuild is used instead.
  - "!**/node_modules/@serialport/bindings-cpp/build/**"
asarUnpack:
  - resources/**
win:
  executableName: Modbux
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch: x64
    - target: dmg
      arch: arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  icon: build/icons/png
  maintainer: deketelaerejens@gmail.com
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  # The default list omits libasound2, and the app then fails to start on
  # "libasound.so.2: cannot open shared object file". Setting depends replaces
  # the default list, so it is restated in full.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
npmRebuild: false
